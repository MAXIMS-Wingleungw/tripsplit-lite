<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>TripSplit Lite 2.0</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot">正在開啟 TripSplit Lite...</div>
<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand">↗ TripSplit Lite <small>2.0</small></div>
    <div id="tripBadge" class="trip-badge" role="button" tabindex="0" title="點擊切換行程">尚未選擇行程</div>
    <nav id="desktopNav"></nav>
  </aside>
  <main>
    <header>
      <div>
        <h1 id="title">我的行程</h1>
        <p id="subtitle">完全離線，資料保存在此瀏覽器</p>
      </div>
      <button id="quickAdd" class="primary" hidden>＋ 新增帳目</button>
    </header>
    <div id="message" aria-live="polite"></div>
    <section id="view"></section>
  </main>
  <nav id="mobileNav" class="mobile-nav"></nav>
</div>

<div id="modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel">
    <form id="modalForm" novalidate>
      <div class="dialog-head">
        <h2 id="modalTitle"></h2>
        <button type="button" data-close aria-label="關閉">✕</button>
      </div>
      <div id="modalNotice" class="modal-notice" hidden></div>
      <div id="modalBody"></div>
      <div class="dialog-actions">
        <button type="button" data-close>取消</button>
        <button class="primary" type="submit">儲存</button>
      </div>
    </form>
  </div>
</div>
<script src="js/database.js"></script>
<script src="js/calculations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
